{% extends "base.html" %}

{% block title %}Login - Student Portal{% endblock %}

{% block content %}
<div class="card" style="max-width: 450px; margin: 0 auto;">
    <h2>Student Login</h2>
    <p class="card-subtitle">Enter your registered email and password to log in.</p>

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-block">Login</button>
    </form>

    <p style="margin-top: 20px; text-align: center; font-size: 14px; color: #94a3b8;">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: #6366f1;">Register here</a>
    </p>
</div>
{% endblock %}
