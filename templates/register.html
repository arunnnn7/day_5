{% extends "base.html" %}

{% block title %}Register - Student Portal{% endblock %}

{% block content %}
<div class="card" style="max-width: 550px; margin: 0 auto;">
    <h2>Student Registration</h2>
    <p class="card-subtitle">Fill in the form below to create your student account.</p>

    <!-- Alert / Error message container -->
    <div id="error-msg" class="alert alert-danger" style="display: {% if error %}block{% else %}none{% endif %};">
        {{ error if error else '' }}
    </div>

    <form id="registerForm" action="{{ url_for('register') }}" method="POST">
        
        <!-- Full Name -->
        <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name">
        </div>

        <!-- Email -->
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email address">
        </div>

        <!-- Age -->
        <div class="form-group">
            <label for="age">Age *</label>
            <input type="number" id="age" name="age" class="form-control" placeholder="Enter age (e.g. 21)">
        </div>

        <!-- Gender -->
        <div class="form-group">
            <label>Gender *</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="gender" value="Male"> Male
                </label>
                <label>
                    <input type="radio" name="gender" value="Female"> Female
                </label>
                <label>
                    <input type="radio" name="gender" value="Other"> Other
                </label>
            </div>
        </div>

        <!-- Course -->
        <div class="form-group">
            <label for="course">Course *</label>
            <select id="course" name="course" class="form-control">
                <option value="">-- Select a Course --</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Data Science">Data Science</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Cyber Security">Cyber Security</option>
            </select>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password * (Minimum 6 characters)</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter password">
        </div>

        <button type="submit" class="btn btn-block">Register</button>
    </form>

    <p style="margin-top: 20px; text-align: center; font-size: 14px; color: #94a3b8;">
        Already registered? <a href="{{ url_for('login') }}" style="color: #6366f1;">Login here</a>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
